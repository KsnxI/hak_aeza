services:
  db:
    image: postgres:16
    restart: unless-stopped

    env_file:
      - .env.development

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend:/app/backend

    depends_on:
      db:
        condition: service_healthy

    command:
      - sh
      - -c
      - >
        alembic -c backend/alembic.ini upgrade head &&
        exec uvicorn backend.main:app
        --host 0.0.0.0
        --port 8000
        --reload


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_USE_MOCK: "false"
      VITE_API_PROXY_TARGET: "http://backend:8000"
    restart: unless-stopped

volumes:
  postgres_data: