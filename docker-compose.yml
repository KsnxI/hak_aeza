services:
  db:
    image: postgres:16
    restart: unless-stopped

    env_file:
      - .env.development

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.development

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend:/app/backend

    depends_on:
      db:
        condition: service_healthy

    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

volumes:
  postgres_data: